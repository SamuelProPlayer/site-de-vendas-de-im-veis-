<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login - Área do Corretor SA Central de Vendas">
    <title>Login - SA Central de Vendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/css/custom-grid.css">
    <link rel="stylesheet" href="css/css/style.css">
    <link rel="shortcut icon" href="logo.png">
</head>
<body>
    <!-- Navegação -->
    <nav class="nav">
        <div id="logo">
            <a href="index.html"><img src="logo.png" alt="Logo SA Central" height="60"></a>
        </div>
        <div class="btn-nav">
            <a href="index.html"><button>Home</button></a>
            <a href="index.html#contato"><button>Contato</button></a>
        </div>
    </nav>

    <!-- Container de Login -->
    <div class="login-container">
        <section class="login-box">
            <h2>Área do Corretor</h2>
            <form id="form-login" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="username"
                        placeholder="seu@email.com"
                        aria-label="Email do corretor"
                    >
                    <small class="error-message" id="error-email" role="alert"></small>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                        autocomplete="current-password"
                        placeholder="Sua senha"
                        aria-label="Senha do corretor"
                    >
                    <small class="error-message" id="error-senha" role="alert"></small>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>
            <div class="login-footer">
                <p>Não tem acesso? <a href="#">Solicite ao administrador</a></p>
                <p><a href="index.html">Voltar para Home</a></p>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="footer" style="position: fixed; bottom: 0; width: 100%;">
        <div class="footer-content">
            <p>&copy; 2026 SA Incorporadora. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        const formLogin = document.getElementById('form-login');
        const campoEmail = document.getElementById('email');
        const campoSenha = document.getElementById('senha');
        const erroEmail = document.getElementById('error-email');
        const erroSenha = document.getElementById('error-senha');

        formLogin.addEventListener('submit', function (event) {
            event.preventDefault();

            const email = campoEmail.value.trim();
            const senha = campoSenha.value;
            const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

            erroEmail.textContent = emailValido ? '' : 'Email inválido.';
            erroSenha.textContent = senha.length >= 6 ? '' : 'A senha deve ter pelo menos 6 caracteres.';

            if (!emailValido || senha.length < 6) return;

            // Credenciais demonstrativas; não substituem autenticação de servidor.
            if (email === 'corretor@savendas.com' && senha === '123456') {
                try {
                    localStorage.setItem('corretor-autenticado', JSON.stringify({
                        email: email,
                        nome: 'João Silva',
                        autenticadoEm: new Date().toISOString()
                    }));
                } catch (error) {
                    alert('Não foi possível salvar a sessão neste navegador. Verifique as configurações de armazenamento.');
                    return;
                }

                window.location.assign('cadastro-imovel.html');
                return;
            }

            alert('Email ou senha inválidos!');
        });
    </script>
</body>
</html>
